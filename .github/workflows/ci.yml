name: CI

# Runs the full pytest suite on every push and on pull requests so that a
# broken change cannot merge unnoticed. No deployment, no secrets required.
on:
  push:
  pull_request:

# Least privilege: the test job only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the project's documented Python 3.9 compatibility target
          # (README "Setup", Dockerfile base image).
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt carries both runtime and test dependencies
          # (fastapi, uvicorn, httpx, pytest) on this branch.
          pip install -r requirements.txt

      - name: Run tests
        # The real, full suite. No continue-on-error, no "|| true", no
        # --exit-zero: a failing test fails the job.
        run: pytest -v
