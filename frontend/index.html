<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-alt: #f1f2f5;
      --border: #e2e4e9;
      --text: #1a1d23;
      --text-muted: #6b7280;

      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-ring: rgba(79, 70, 229, 0.15);

      --danger: #dc2626;
      --danger-bg: #fee2e2;

      --priority-high: #b91c1c;
      --priority-high-bg: #fee2e2;
      --priority-medium: #b45309;
      --priority-medium-bg: #fef3c7;
      --priority-low: #15803d;
      --priority-low-bg: #dcfce7;

      --status-todo: #6b7280;
      --status-inprogress: #2563eb;
      --status-done: #16a34a;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
      --shadow-md: 0 6px 16px rgba(16, 24, 40, 0.10);
      --shadow-lg: 0 16px 40px rgba(16, 24, 40, 0.20);

      --drag-over-bg: rgba(79, 70, 229, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1c1f26;
        --surface-alt: #20232b;
        --border: #2c2f38;
        --text: #e6e8eb;
        --text-muted: #9aa1ac;

        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --accent-ring: rgba(129, 140, 248, 0.25);

        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.15);

        --priority-high: #fca5a5;
        --priority-high-bg: rgba(248, 113, 113, 0.15);
        --priority-medium: #fcd34d;
        --priority-medium-bg: rgba(251, 191, 36, 0.15);
        --priority-low: #86efac;
        --priority-low-bg: rgba(74, 222, 128, 0.15);

        --status-todo: #9aa1ac;
        --status-inprogress: #60a5fa;
        --status-done: #4ade80;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);

        --drag-over-bg: rgba(129, 140, 248, 0.12);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* Header */

    header.app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.75rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header.app-header h1 {
      margin: 0;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header.app-header p {
      margin: 0.25rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* Status banner */

    #board-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0.65rem 1.75rem;
      font-size: 0.875rem;
    }

    #board-banner:empty {
      display: none;
      padding: 0;
    }

    #board-banner[data-state="loading"] {
      color: var(--text-muted);
    }

    #board-banner[data-state="error"] {
      color: var(--danger);
      font-weight: 600;
      background: var(--danger-bg);
    }

    .spinner {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Board + columns */

    main.board {
      display: flex;
      gap: 1.25rem;
      padding: 1.5rem 1.75rem;
      align-items: flex-start;
    }

    section.column {
      flex: 1 1 0;
      min-width: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
    }

    section.column h2 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 0.9rem;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    section.column[data-status="ToDo"] .status-dot {
      background: var(--status-todo);
    }

    section.column[data-status="InProgress"] .status-dot {
      background: var(--status-inprogress);
    }

    section.column[data-status="Done"] .status-dot {
      background: var(--status-done);
    }

    .column-count {
      margin-left: auto;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.05rem 0.5rem;
    }

    ul.card-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 3rem;
      border-radius: var(--radius-md);
      transition: background-color 0.15s ease;
    }

    ul.card-list.drag-over {
      background: var(--drag-over-bg);
      outline: 2px dashed var(--accent);
      outline-offset: 3px;
    }

    /* Cards */

    li.card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.8rem 0.9rem;
      box-shadow: var(--shadow-sm);
      cursor: grab;
      transition: box-shadow 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    li.card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    li.card:active {
      cursor: grabbing;
    }

    li.card.dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }

    li.card .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.3;
      margin: 0 0 0.5rem;
    }

    li.card .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .priority-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
    }

    .priority-High {
      color: var(--priority-high);
      background: var(--priority-high-bg);
    }

    .priority-Medium {
      color: var(--priority-medium);
      background: var(--priority-medium-bg);
    }

    .priority-Low {
      color: var(--priority-low);
      background: var(--priority-low-bg);
    }

    .due-date {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      white-space: nowrap;
    }

    .due-date svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .due-date.overdue {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: transparent;
      font-weight: 700;
    }

    .assignee {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: #fff;
    }

    .avatar.unassigned {
      background: transparent;
      border: 1px dashed var(--border);
    }

    .card-actions {
      display: flex;
      gap: 0.1rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      border-radius: 6px;
      padding: 0.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    .icon-btn:hover {
      background: var(--surface-alt);
    }

    .icon-btn.edit:hover {
      color: var(--accent);
    }

    .icon-btn.delete:hover {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 1.5rem 0.5rem;
    }

    .empty-placeholder svg {
      width: 26px;
      height: 26px;
      opacity: 0.5;
    }

    @media (max-width: 720px) {
      main.board {
        flex-direction: column;
      }

      section.column {
        width: 100%;
      }
    }

    /* Board controls (filter bar) */

    .board-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.75rem 1.75rem 0;
    }

    .filter-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .filter-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .filter-input {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.6rem;
    }

    #filter-search {
      flex: 1 1 12rem;
      min-width: 8rem;
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .board-controls .btn-secondary {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    /* Modal */

    dialog#task-modal {
      border: none;
      border-radius: var(--radius-lg);
      padding: 0;
      width: min(440px, 92vw);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-lg);
    }

    dialog#task-modal::backdrop {
      background: rgba(10, 12, 15, 0.5);
    }

    #task-form {
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.5rem 1.25rem;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    #modal-close-btn {
      color: var(--text-muted);
    }

    .modal-error {
      color: var(--danger);
      font-size: 0.82rem;
      min-height: 1.1em;
      margin: 0.25rem 0 0.5rem;
    }

    .field {
      margin-bottom: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .field label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }

    .field input,
    .field textarea,
    .field select {
      font: inherit;
      color: var(--text);
      background: var(--surface-alt);
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .field-row {
      display: flex;
      gap: 0.75rem;
    }

    .field-row .field {
      flex: 1 1 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Task Tracker</h1>
      <p>Module 3 — Kanban board</p>
    </div>
    <button type="button" id="new-task-btn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      New Task
    </button>
  </header>

  <p id="board-banner" role="status" aria-live="polite"></p>

  <dialog id="task-modal" aria-labelledby="task-modal-heading">
    <form id="task-form" novalidate>
      <div class="modal-header">
        <h2 id="task-modal-heading">New Task</h2>
        <button type="button" id="modal-close-btn" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>

      <p class="modal-error" id="modal-error" role="alert"></p>

      <div class="field">
        <label for="task-title">Title</label>
        <input type="text" id="task-title" name="title" maxlength="200" />
      </div>

      <div class="field">
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="3"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status" name="status">
            <option value="ToDo">To Do</option>
            <option value="InProgress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>

        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="task-due-date">Due date</label>
        <input type="date" id="task-due-date" name="due_date" />
      </div>

      <div class="field">
        <label for="task-assignee">Assignee</label>
        <input type="text" id="task-assignee" name="assignee" />
      </div>

      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="btn-secondary">Cancel</button>
        <button type="submit" id="modal-submit-btn" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div class="board-controls" role="search">
    <input type="search" id="filter-search" class="filter-input" placeholder="Search title or description…" aria-label="Search tasks" />
    <select id="filter-status" class="filter-input" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="ToDo">To Do</option>
      <option value="InProgress">In Progress</option>
      <option value="Done">Done</option>
    </select>
    <select id="filter-priority" class="filter-input" aria-label="Filter by priority">
      <option value="">All priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
    <input type="text" id="filter-assignee" class="filter-input" placeholder="Assignee" aria-label="Filter by assignee" />
    <label class="filter-toggle">
      <input type="checkbox" id="overdue-filter" />
      Overdue only
    </label>
    <button type="button" id="filter-clear" class="btn-secondary">Clear</button>
  </div>

  <main class="board" aria-label="Task board">
    <section class="column" data-status="ToDo" aria-labelledby="column-todo-heading">
      <h2 id="column-todo-heading"><span class="status-dot" aria-hidden="true"></span><span class="column-label" data-label-for="ToDo"></span> <span class="column-count" data-count-for="ToDo"></span></h2>
      <ul class="card-list" data-status-list="ToDo"></ul>
    </section>

    <section class="column" data-status="InProgress" aria-labelledby="column-inprogress-heading">
      <h2 id="column-inprogress-heading"><span class="status-dot" aria-hidden="true"></span><span class="column-label" data-label-for="InProgress"></span> <span class="column-count" data-count-for="InProgress"></span></h2>
      <ul class="card-list" data-status-list="InProgress"></ul>
    </section>

    <section class="column" data-status="Done" aria-labelledby="column-done-heading">
      <h2 id="column-done-heading"><span class="status-dot" aria-hidden="true"></span><span class="column-label" data-label-for="Done"></span> <span class="column-count" data-count-for="Done"></span></h2>
      <ul class="card-list" data-status-list="Done"></ul>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const STATUS_LABELS = { ToDo: "To Do", InProgress: "In Progress", Done: "Done" };
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

    const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
    const ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>';
    const ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"></rect><path d="M3 12h5l1.5 2h5L16 12h5"></path></svg>';
    const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>';

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function formatDueDate(iso) {
      // iso is "YYYY-MM-DD". Parse the parts directly to avoid the day-shift
      // that new Date("YYYY-MM-DD") (parsed as UTC) can cause in some zones.
      const parts = iso.split("-");
      const year = Number(parts[0]);
      const month = Number(parts[1]);
      const day = Number(parts[2]);
      if (!year || !month || !day) return iso;
      return `${MONTHS[month - 1]} ${day}, ${year}`;
    }

    const AVATAR_COLORS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899"];

    function getInitials(name) {
      return name
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map((word) => word[0].toUpperCase())
        .join("");
    }

    function avatarColor(name) {
      let hash = 0;
      for (const ch of name) {
        hash = (hash * 31 + ch.charCodeAt(0)) % AVATAR_COLORS.length;
      }
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    const banner = document.getElementById("board-banner");
    const overdueFilter = document.getElementById("overdue-filter");
    const filterSearch = document.getElementById("filter-search");
    const filterStatus = document.getElementById("filter-status");
    const filterPriority = document.getElementById("filter-priority");
    const filterAssignee = document.getElementById("filter-assignee");
    const filterClear = document.getElementById("filter-clear");

    function setBannerState(state, message) {
      banner.dataset.state = state;
      banner.innerHTML = "";
      if (state === "loading") {
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        spinner.setAttribute("aria-hidden", "true");
        banner.appendChild(spinner);
      }
      if (message) {
        banner.appendChild(document.createTextNode(message));
      }
    }

    function buildTaskQuery() {
      // URLSearchParams encodes values (spaces, &, %, unicode). Blank text and
      // the "All …" (value="") select options are OMITTED, not sent: an empty
      // enum like ?status= would be rejected by the backend as invalid.
      const params = new URLSearchParams();
      const search = filterSearch.value.trim();
      if (search) params.set("search", search);
      if (filterStatus.value) params.set("status", filterStatus.value);
      if (filterPriority.value) params.set("priority", filterPriority.value);
      const assignee = filterAssignee.value.trim();
      if (assignee) params.set("assignee", assignee);
      if (overdueFilter.checked) params.set("overdue", "true"); // never send overdue=false
      const query = params.toString();
      return query ? `?${query}` : "";
    }

    async function fetchTasks() {
      const response = await fetch(`${API_BASE}/tasks${buildTaskQuery()}`);
      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }
      return response.json();
    }

    function groupByStatus(tasks) {
      const groups = { ToDo: [], InProgress: [], Done: [] };
      for (const task of tasks) {
        if (groups[task.status]) {
          groups[task.status].push(task);
        }
      }
      return groups;
    }

    function sortTasks(tasks) {
      return [...tasks].sort((a, b) => {
        const priorityDiff = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
        if (priorityDiff !== 0) return priorityDiff;
        return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
      });
    }

    function renderCard(task) {
      const li = document.createElement("li");
      li.className = "card";
      li.dataset.taskId = task.id;
      li.draggable = true;

      const title = document.createElement("p");
      title.className = "card-title";
      title.textContent = task.title;
      li.appendChild(title);

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const priority = document.createElement("span");
      priority.className = `priority-badge priority-${task.priority}`;
      priority.textContent = task.priority;
      footer.appendChild(priority);

      if (task.due_date) {
        const due = document.createElement("span");
        due.className = task.overdue ? "due-date overdue" : "due-date";
        due.innerHTML = ICON_CALENDAR;
        const dueText = document.createElement("span");
        dueText.textContent = formatDueDate(task.due_date);
        due.appendChild(dueText);
        if (task.overdue) {
          // Not color-only: expose overdue to hover and assistive tech.
          due.title = "Overdue";
          due.setAttribute("aria-label", `Due ${formatDueDate(task.due_date)}, overdue`);
        }
        footer.appendChild(due);
      }

      const assigneeWrap = document.createElement("span");
      assigneeWrap.className = "assignee";
      const avatar = document.createElement("span");
      if (task.assignee) {
        avatar.className = "avatar";
        avatar.style.background = avatarColor(task.assignee);
        avatar.textContent = getInitials(task.assignee);
        assigneeWrap.title = task.assignee;
        assigneeWrap.appendChild(avatar);
        const name = document.createElement("span");
        name.textContent = task.assignee;
        assigneeWrap.appendChild(name);
      } else {
        avatar.className = "avatar unassigned";
        assigneeWrap.title = "Unassigned";
        assigneeWrap.appendChild(avatar);
      }
      footer.appendChild(assigneeWrap);

      const actions = document.createElement("span");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "icon-btn edit";
      editBtn.innerHTML = ICON_EDIT;
      editBtn.setAttribute("aria-label", `Edit ${task.title}`);
      editBtn.addEventListener("click", () => openEditModal(task));
      actions.appendChild(editBtn);

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "icon-btn delete";
      deleteBtn.innerHTML = ICON_DELETE;
      deleteBtn.setAttribute("aria-label", `Delete ${task.title}`);
      deleteBtn.addEventListener("click", () => handleDeleteClick(task));
      actions.appendChild(deleteBtn);

      footer.appendChild(actions);
      li.appendChild(footer);

      li.addEventListener("dragstart", (event) => {
        // event.target during a native dragstart isn't guaranteed to be an
        // Element: if the drag starts exactly on a text node (e.g. pressing
        // down on the card's rendered text), some browsers report the Text
        // node itself, which has no .closest(). Normalize to the nearest
        // Element first.
        const targetEl = event.target instanceof Element ? event.target : event.target.parentElement;
        if (targetEl && targetEl.closest(".icon-btn")) {
          event.preventDefault();
          return;
        }
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", JSON.stringify({ id: task.id, status: task.status }));
        li.classList.add("dragging");
      });
      li.addEventListener("dragend", () => {
        li.classList.remove("dragging");
      });

      return li;
    }

    function renderBoard(tasks) {
      const groups = groupByStatus(tasks);

      for (const status of STATUSES) {
        const listEl = document.querySelector(`[data-status-list="${status}"]`);
        const labelEl = document.querySelector(`[data-label-for="${status}"]`);
        const countEl = document.querySelector(`[data-count-for="${status}"]`);
        const columnTasks = sortTasks(groups[status]);

        listEl.innerHTML = "";
        labelEl.textContent = STATUS_LABELS[status];
        countEl.textContent = `(${columnTasks.length})`;

        if (columnTasks.length === 0) {
          const placeholder = document.createElement("li");
          placeholder.className = "empty-placeholder";
          placeholder.innerHTML = ICON_EMPTY;
          const text = document.createElement("span");
          text.textContent = "No tasks";
          placeholder.appendChild(text);
          listEl.appendChild(placeholder);
          continue;
        }

        for (const task of columnTasks) {
          listEl.appendChild(renderCard(task));
        }
      }
    }

    async function refreshBoard() {
      const tasks = await fetchTasks();
      renderBoard(tasks);
    }

    // Monotonic id so a slow earlier response from rapid filter changes can't
    // overwrite a newer one (stale-response guard). Simpler than AbortController
    // and it never renders an aborted request as a fake error.
    let loadSeq = 0;
    async function loadBoard() {
      const seq = ++loadSeq;
      setBannerState("loading", "Loading tasks…");
      let tasks;
      try {
        tasks = await fetchTasks();
      } catch (error) {
        if (seq === loadSeq) setBannerState("error", `Couldn't load tasks: ${error.message}`);
        return;
      }
      if (seq !== loadSeq) return; // a newer load started; drop this stale result
      renderBoard(tasks);
      setBannerState("ready", "");
    }

    const inFlightUpdates = new Set();

    async function handleDrop(taskId, originalStatus, newStatus) {
      if (originalStatus === newStatus) return; // same-column drop: no PATCH
      if (inFlightUpdates.has(taskId)) return; // avoid duplicate in-flight updates

      inFlightUpdates.add(taskId);
      let dragError = null;
      try {
        const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          dragError = typeof body.detail === "string" ? body.detail : `Request failed with status ${response.status}`;
        }
      } catch (error) {
        dragError = error.message;
      } finally {
        inFlightUpdates.delete(taskId);
      }

      // Backend is the sole authority on transition validity: always
      // reconcile with server truth after the attempt, whether it
      // succeeded or was rejected.
      try {
        await refreshBoard();
        setBannerState(dragError ? "error" : "ready", dragError ? `Couldn't move task: ${dragError}` : "");
      } catch (error) {
        setBannerState("error", `Couldn't load tasks: ${error.message}`);
      }
    }

    async function deleteTask(taskId) {
      let deleteError = null;
      try {
        const response = await fetch(`${API_BASE}/tasks/${taskId}`, { method: "DELETE" });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          deleteError = typeof body.detail === "string" ? body.detail : `Request failed with status ${response.status}`;
        }
      } catch (error) {
        deleteError = error.message;
      }

      try {
        await refreshBoard();
        setBannerState(deleteError ? "error" : "ready", deleteError ? `Couldn't delete task: ${deleteError}` : "");
      } catch (error) {
        setBannerState("error", `Couldn't load tasks: ${error.message}`);
      }
    }

    function handleDeleteClick(task) {
      const confirmed = window.confirm(`Delete "${task.title}"? This can't be undone.`);
      if (!confirmed) return;
      deleteTask(task.id);
    }

    function attachColumnDropHandlers() {
      for (const status of STATUSES) {
        const listEl = document.querySelector(`[data-status-list="${status}"]`);

        listEl.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
        });
        listEl.addEventListener("dragenter", () => {
          listEl.classList.add("drag-over");
        });
        listEl.addEventListener("dragleave", () => {
          listEl.classList.remove("drag-over");
        });
        listEl.addEventListener("drop", (event) => {
          event.preventDefault();
          listEl.classList.remove("drag-over");

          const raw = event.dataTransfer.getData("text/plain");
          if (!raw) return;

          let dragged;
          try {
            dragged = JSON.parse(raw);
          } catch (error) {
            return;
          }

          handleDrop(dragged.id, dragged.status, status);
        });
      }
    }

    const modal = document.getElementById("task-modal");
    const taskForm = document.getElementById("task-form");
    const modalHeading = document.getElementById("task-modal-heading");
    const modalError = document.getElementById("modal-error");
    const titleInput = document.getElementById("task-title");
    const descriptionInput = document.getElementById("task-description");
    const statusSelect = document.getElementById("task-status");
    const prioritySelect = document.getElementById("task-priority");
    const assigneeInput = document.getElementById("task-assignee");
    const dueDateInput = document.getElementById("task-due-date");

    let editingTaskId = null;
    let editingOriginalStatus = null;

    function resetModalForm() {
      editingTaskId = null;
      editingOriginalStatus = null;
      taskForm.reset();
      modalError.textContent = "";
    }

    function openCreateModal() {
      resetModalForm();
      modalHeading.textContent = "New Task";
      statusSelect.value = "ToDo";
      prioritySelect.value = "Medium";
      modal.showModal();
    }

    function openEditModal(task) {
      editingTaskId = task.id;
      editingOriginalStatus = task.status;
      modalError.textContent = "";
      modalHeading.textContent = "Edit Task";
      titleInput.value = task.title;
      descriptionInput.value = task.description || "";
      statusSelect.value = task.status;
      prioritySelect.value = task.priority;
      assigneeInput.value = task.assignee || "";
      dueDateInput.value = task.due_date || "";
      modal.showModal();
    }

    document.getElementById("new-task-btn").addEventListener("click", openCreateModal);
    document.getElementById("modal-cancel-btn").addEventListener("click", () => modal.close());
    document.getElementById("modal-close-btn").addEventListener("click", () => modal.close());

    // Every dismissal path (Cancel, X, Escape, backdrop click) ends in the
    // dialog's native 'close' event, so stale id/values/errors are cleared
    // in exactly one place regardless of how the modal was dismissed.
    modal.addEventListener("close", resetModalForm);

    // Escape and Cancel/X all call modal.close() (or fire the dialog's
    // native 'cancel' event) which is enough; clicking the backdrop needs
    // this explicit check so clicks inside the dialog content don't close it.
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.close();
      }
    });

    taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const trimmedTitle = titleInput.value.trim();
      if (!trimmedTitle) {
        modalError.textContent = "Title is required.";
        return; // client-side only: no network request for a blank title
      }

      const trimmedAssignee = assigneeInput.value.trim();
      const payload = {
        title: trimmedTitle,
        description: descriptionInput.value,
        priority: prioritySelect.value,
        assignee: trimmedAssignee === "" ? null : trimmedAssignee,
        // Empty date input -> null (the backend's "no due date" representation).
        // A filled input is already "YYYY-MM-DD", exactly what the API expects.
        due_date: dueDateInput.value === "" ? null : dueDateInput.value,
      };

      const isEdit = editingTaskId !== null;
      if (isEdit) {
        // Only send status if it actually changed: the backend rejects a
        // same->same status PATCH as an invalid transition (see
        // app/business_rules.py), so sending the unchanged value on every
        // save would break plain title/description edits.
        if (statusSelect.value !== editingOriginalStatus) {
          payload.status = statusSelect.value;
        }
      } else {
        payload.status = statusSelect.value;
      }

      const url = isEdit ? `${API_BASE}/tasks/${editingTaskId}` : `${API_BASE}/tasks`;
      const method = isEdit ? "PATCH" : "POST";

      let response;
      try {
        response = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      } catch (error) {
        modalError.textContent = `Couldn't save task: ${error.message}`;
        return;
      }

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        modalError.textContent =
          typeof body.detail === "string" ? body.detail : `Request failed with status ${response.status}`;
        return; // keep modal open, values intact, per the 422 contract
      }

      modal.close(); // success: clears errors, closes, resets via 'close' listener

      try {
        await refreshBoard();
        setBannerState("ready", "");
      } catch (error) {
        setBannerState("error", `Couldn't load tasks: ${error.message}`);
      }
    });

    // All filtering is server-side (the board renders server truth; there is no
    // client-side filtering). Selects/checkbox reload immediately; the free-text
    // inputs are debounced so typing doesn't fire a request per keystroke — no
    // library, just a shared timer.
    let filterDebounce = null;
    function scheduleFilterReload() {
      clearTimeout(filterDebounce);
      filterDebounce = setTimeout(loadBoard, 250);
    }
    filterSearch.addEventListener("input", scheduleFilterReload);
    filterAssignee.addEventListener("input", scheduleFilterReload);
    filterStatus.addEventListener("change", loadBoard);
    filterPriority.addEventListener("change", loadBoard);
    overdueFilter.addEventListener("change", loadBoard);

    filterClear.addEventListener("click", () => {
      clearTimeout(filterDebounce); // drop any queued keystroke reload
      filterSearch.value = "";
      filterStatus.value = "";
      filterPriority.value = "";
      filterAssignee.value = "";
      overdueFilter.checked = false;
      loadBoard(); // set controls directly (no synthetic events) -> one unfiltered fetch
    });

    attachColumnDropHandlers();
    loadBoard();
  </script>
</body>
</html>
